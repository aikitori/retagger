# Run tests and build the APK.
# - version tag (v1.0, v1.1, ...): signed APK as a GitHub release, version name from the tag.
# - everything else: check build only (debug APK as artifact).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --console=plain :core:test

      - name: Load signing key from secrets
        if: env.RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Signing key missing::These repo secrets are missing:$missing. Set them up once: bash scripts/setup-keystore.sh"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        if: env.RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionCode keeps counting up across tags, so updates install over the existing app
          ./gradlew --console=plain :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${GITHUB_REF_NAME#v}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/retagger.apk"
          # make sure it really is signed with the fixed key
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$GITHUB_WORKSPACE/retagger.apk"

      - name: Publish release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Retagger ${{ github.ref_name }}
          make_latest: true
          prerelease: false
          files: retagger.apk
          generate_release_notes: true

      - name: Check build (debug APK)
        if: env.RELEASE != 'true'
        run: ./gradlew --console=plain :app:assembleDebug -PversionCode=${{ github.run_number }}

      - name: Upload check build
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: retagger-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
